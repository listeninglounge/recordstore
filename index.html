<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#241713" />
  <title>Listening Lounge</title>
  <meta name="description" content="Listening Lounge touchscreen experience for AI Skills Navigator." />
  <style>
    :root{
      color-scheme: dark;
      --ink:#211510;
      --cream:#f8eedb;
      --muted:#d3c3a9;
      --amber:#e9b768;
      --teal:#83b8ad;
      --line:rgba(255,228,183,.24);
      --card:#2d1d19;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      height:100%;
      overflow:hidden;
    }
    body{
      color:var(--cream);
      font-family:Arial,Helvetica,sans-serif;
      line-height:1.5;
      background:
        radial-gradient(ellipse at 50% 13%,rgba(245,173,81,.15),transparent 48%),
        repeating-linear-gradient(0deg,transparent 0 31px,rgba(13,6,4,.32) 32px,rgba(244,170,85,.055) 33px,transparent 35px),
        linear-gradient(110deg,#1b100e,#43291d 48%,#1c1110);
      min-height:100dvh;
    }

    h1,h2,h3,p{margin-top:0}
    h1,h2{
      font-family:Georgia,"Times New Roman",serif;
      font-weight:400;
      line-height:1.08;
    }

    .shell{
      max-width:1360px;
      margin:auto;
      height:100dvh;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:10px;
      padding:12px clamp(14px,3vw,40px) 14px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      padding:14px 0;
      border-bottom:1px solid var(--line);
    }

    .brand{
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.24em;
      text-transform:uppercase;
    }

    .ghost-btn,.back-btn{
      border:1px solid var(--line);
      background:rgba(25,14,12,.65);
      color:var(--cream);
      border-radius:50px;
      padding:12px 18px;
      min-height:48px;
      font:inherit;
      font-weight:700;
      cursor:pointer;
    }

    .eyebrow{
      font-size:.76rem;
      font-weight:800;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--amber);
      margin:0 0 10px;
    }

    .hero{
      position:relative;
      min-height:0;
      display:flex;
      align-items:center;
      overflow:visible;
      padding:28px 0 16px;
    }

    .hero:after{
      content:"";
      position:absolute;
      inset:auto -6% 0;
      height:24px;
      background:linear-gradient(#d19450,#74452b 30%,#301a14 72%,#170e0c);
      box-shadow:0 -13px 35px rgba(243,166,72,.2),0 14px 25px #130b09;
      pointer-events:none;
    }

    .hero-copy{max-width:980px;position:relative;z-index:1}
    h1{
      font-size:clamp(2.3rem,5vw,4.6rem);
      letter-spacing:-.04em;
      margin:0 0 10px;
    }

    .hero p:not(.eyebrow){
      font-size:clamp(.95rem,1.4vw,1.1rem);
      color:var(--muted);
      max-width:none;
      white-space:nowrap;
      text-wrap:nowrap;
      margin:0;
    }

    .pendant{
      position:absolute;
      right:14%;
      top:18px;
      width:2px;
      height:88px;
      background:#130c0b;
    }
    .pendant:after{
      content:"";
      position:absolute;
      top:86px;left:-67px;
      width:136px;height:45px;
      border-radius:85px 85px 18px 18px;
      background:linear-gradient(#100c0c,#28201c 80%,#d5aa72);
      box-shadow:0 22px 70px 24px rgba(239,171,87,.14);
    }

    .collection-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:20px;
      margin:10px 0 12px;
    }
    .collection-head p{margin:0;color:var(--muted)}
    h2{
      font-size:clamp(1.5rem,3.2vw,2.8rem);
      letter-spacing:-.03em;
      margin:0;
    }

    .shelf{
      min-height:0;
      padding:10px 10px 16px;
      border:1px solid rgba(255,211,150,.18);
      border-radius:16px;
      background:linear-gradient(180deg,rgba(252,193,107,.1),rgba(18,11,10,.75) 38%,rgba(15,9,8,.8));
      box-shadow:inset 0 16px 36px rgba(250,181,89,.09),0 22px 40px rgba(0,0,0,.2);
      display:grid;
      grid-template-rows:1fr auto;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:clamp(10px,1.2vw,14px);
      min-height:0;
    }

    .record{
      width:100%;
      border:1px solid rgba(255,227,184,.17);
      border-radius:13px;
      background:var(--card);
      color:var(--cream);
      padding:8px 8px 10px;
      min-height:0;
      text-align:left;
      font:inherit;
      cursor:pointer;
      transition:transform .16s,border-color .16s,box-shadow .16s;
      touch-action:manipulation;
      -webkit-tap-highlight-color: transparent;
      display:grid;
      grid-template-rows:auto auto auto 1fr;
      gap:6px;
      align-content:start;
    }

    .record:active{transform:scale(.99)}
    .record:hover{
      transform:translateY(-4px);
      border-color:var(--amber);
      box-shadow:0 18px 30px rgba(0,0,0,.34);
    }

    .cover{
      aspect-ratio:4 / 3;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      overflow:hidden;
      position:relative;
      border-radius:5px;
      padding:10px 10px 10px 12px;
      background:var(--cover);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.16),
        inset 0 0 0 8px rgba(255,255,255,.03),
        0 10px 20px rgba(0,0,0,.3);
    }

    .cover:before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:22%;
      background:rgba(0,0,0,.28);
      border-right:1px solid rgba(255,255,255,.2);
    }

    .cover:after{
      content:"";
      position:absolute;
      right:9px;
      bottom:9px;
      width:46px;
      height:9px;
      background:repeating-linear-gradient(
        90deg,
        rgba(245,240,230,.95) 0 2px,
        rgba(70,60,50,.95) 2px 3px
      );
      border:1px solid rgba(255,255,255,.35);
      box-shadow:0 1px 0 rgba(0,0,0,.2);
      pointer-events:none;
    }

    .cover .glare{
      position:absolute;
      inset:0;
      background:linear-gradient(125deg,rgba(255,255,255,.16),transparent 35%,rgba(0,0,0,.12));
      pointer-events:none;
    }

    .cover span{
      position:relative;z-index:1;
      font-size:.56rem;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-weight:800;
    }

    .cover span:first-child{
      position:absolute;
      left:6px;
      top:8px;
      writing-mode:vertical-rl;
      transform:rotate(180deg);
      color:rgba(255,245,225,.96);
      max-height:88%;
    }

    .cover strong{
      position:relative;z-index:1;
      font:700 clamp(1rem,1.35vw,1.4rem)/1.08 "Segoe UI",Arial,sans-serif;
      max-width:72%;
      margin-left:24%;
      margin-top:6px;
      overflow-wrap:normal;
      word-break:normal;
      hyphens:none;
      text-wrap:balance;
      color:#ffffff;
      background:rgba(16,12,10,.5);
      border:1px solid rgba(255,255,255,.24);
      border-radius:4px;
      padding:6px 8px;
      text-shadow:0 2px 4px rgba(0,0,0,.55);
    }

    .cover span:last-child{
      position:absolute;
      left:calc(22% + 8px);
      bottom:9px;
      color:rgba(255,245,220,.95);
    }

    .record h3{
      font-family:Georgia,serif;
      font-size:1.1rem;
      font-weight:400;
      margin:4px 0 0;
    }

    .record small{
      color:var(--teal);
      letter-spacing:.11em;
      text-transform:uppercase;
      font-size:.64rem;
      font-weight:800;
      display:block;
      margin:0;
    }

    .record p{
      color:var(--muted);
      font-size:.94rem;
      line-height:1.35;
      margin:0;
    }

    .shelf-edge{
      height:12px;
      margin:10px -10px -16px;
      border-radius:0 0 20px 20px;
      background:linear-gradient(#bf8245,#603821 42%,#2a1813);
      box-shadow:0 9px 16px #0d0807;
    }

    .detail{
      height:100%;
      min-height:0;
      display:grid;
      grid-template-rows:auto 1fr;
      gap:8px;
      padding:10px 0 0;
    }

    .detail.hidden,.browse.hidden{display:none}

    .detail-grid{
      display:grid;
      grid-template-columns:minmax(260px,420px) minmax(0,1fr);
      gap:clamp(18px,3vw,40px);
      align-items:center;
      padding:0;
      min-height:0;
    }

    .detail-cover{
      aspect-ratio:1;
      border-radius:10px;
      padding:14px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      background:var(--cover);
      box-shadow:18px 24px 35px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.2);
      position:relative;
      overflow:hidden;
    }

    .detail-cover:before{
      content:"";
      position:absolute;
      width:90%;height:90%;
      border:1px solid rgba(255,243,216,.26);
      border-radius:50%;
      top:24%;left:36%;
      box-shadow:0 0 0 22px rgba(255,244,218,.035),0 0 0 48px rgba(255,244,218,.03);
    }

    .detail-cover span,.detail-cover strong{position:relative;z-index:1}
    .detail-cover span{
      font-size:.72rem;
      letter-spacing:.16em;
      text-transform:uppercase;
      font-weight:800;
    }

    .detail-cover strong{
      font:400 clamp(1.8rem,3.2vw,3.5rem)/1.02 Georgia,serif;
      max-width:100%;
      overflow-wrap:normal;
      word-break:normal;
      hyphens:none;
      text-wrap:balance;
    }

    .detail-copy > p:not(.eyebrow){
      color:var(--muted);
      font-size:1rem;
      margin-bottom:10px;
      max-width:62ch;
    }

    .try-box{
      border:1px solid var(--line);
      border-radius:14px;
      background:linear-gradient(135deg,rgba(125,75,44,.26),rgba(16,11,10,.75));
      padding:12px;
      margin:10px 0 14px;
    }

    .try-box h3{
      margin:0 0 8px;
      font-family:Georgia,serif;
      font-size:1.15rem;
      font-weight:400;
    }

    .try-box p{
      margin:0;
      color:var(--muted);
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:8px;
    }

    .primary-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      border-radius:8px;
      padding:10px 16px;
      font-weight:800;
      text-decoration:none;
      background:var(--amber);
      color:#24130d;
      border:1px solid var(--amber);
    }

    .primary-link:hover{background:#f6cd89}
    .footer{
      margin:0;
      color:var(--muted);
      font-size:.74rem;
      text-align:center;
    }

    main{
      min-height:0;
      overflow:hidden;
    }

    .browse{
      height:100%;
      min-height:0;
      display:grid;
      grid-template-rows:auto auto 1fr;
      gap:12px;
    }

    button:focus-visible,a:focus-visible{
      outline:3px solid #aee2d6;
      outline-offset:4px;
    }

    @media (max-width:950px){
      .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .detail-grid{grid-template-columns:minmax(220px,320px) minmax(0,1fr)}
      .pendant{right:8%}
      h1{white-space:normal}
      .hero p:not(.eyebrow){
        white-space:normal;
        text-wrap:balance;
      }
    }

    @media (max-width:600px){
      body{overflow:auto}
      .shell{height:auto;min-height:100dvh;overflow:auto}
      .hero{min-height:240px}
      .pendant{opacity:.45}
      .grid{grid-template-columns:1fr;gap:12px}
      .shelf{padding:12px 10px 16px}
      .shelf-edge{margin:12px -10px -16px}
      .record{padding:8px 8px 12px;min-height:0}
      .cover{padding:10px}
      .cover strong{font-size:clamp(1.2rem,4.6vw,1.8rem)}
      .record h3{font-size:1.15rem}
      .record p{font-size:.8rem}
      .collection-head{display:block}
      .collection-head p{margin-top:8px}
      .detail{height:auto;display:block}
      .detail-grid{grid-template-columns:1fr}
    }

    @media (prefers-reduced-motion:reduce){
      *,*:before,*:after{transition:none!important;animation:none!important}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">Listening Lounge <span aria-hidden="true">/</span> AI Skills Navigator</div>
      <button id="startOver" class="ghost-btn" type="button">Start over</button>
    </header>

    <main>
      <section id="browse" class="browse" aria-labelledby="welcome-title">
        <div class="hero">
          <div class="pendant" aria-hidden="true"></div>
          <div class="hero-copy">
            <p class="eyebrow">Take a moment. Find your next listen.</p>
            <h1 id="welcome-title">Pull up a seat.<br>Pick a record.</h1>
          </div>
        </div>

        <div class="collection-head">
          <div>
            <p class="eyebrow">The collection</p>
            <h2>What sounds good?</h2>
          </div>
          <p>Tap a sleeve to explore.</p>
        </div>

        <div class="shelf">
          <div class="grid" id="recordGrid"></div>
          <div class="shelf-edge" aria-hidden="true"></div>
        </div>
      </section>

      <section id="detail" class="detail hidden" aria-labelledby="detailTitle">
        <button id="backBtn" class="back-btn" type="button">← Back to the collection</button>

        <div class="detail-grid">
          <div class="detail-cover" id="detailCover" aria-hidden="true">
            <span>Listening Lounge</span>
            <strong id="detailCoverTitle"></strong>
            <span id="detailCoverTag"></span>
          </div>

          <div class="detail-copy">
            <p class="eyebrow" id="detailEyebrow"></p>
            <h2 id="detailTitle"></h2>
            <p id="detailDescription"></p>

            <div class="try-box">
              <h3>What to try</h3>
              <p id="detailWhatToTry"></p>
            </div>

            <div class="actions">
              <a id="detailCta" class="primary-link" href="#" target="_blank" rel="noopener noreferrer">Open in AI Skills Navigator</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">Powered by AI Skills Navigator</footer>
  </div>

  <script>
    (() => {
      "use strict";

      const experiences = [
        {
          id: "podcast",
          menuTitle: "AI-Generated Podcast",
          menuLabel: "Story + audio format",
          menuDescription: "Prefer to listen? See how quickly you can turn a Microsoft Learn module into a podcast you can take with you.",
          detailTitle: "AI-generated podcasts",
          detailEyebrow: "Audio-first learning",
          detailDescription: "Prefer to listen? See how you can turn a Microsoft Learn module into a podcast and take your learning with you.",
          detailWhatToTry: "Choose a module, see how the podcast is created, and listen to a preview.",
          ctaText: "Try an AI-generated podcast",
          url: "https://aiskillsnavigator.microsoft.com/en-us/player?catalogId=module-17b6568933a4fdc7bdcaa1911576b22ac47173f39ef0127bb12485f8c560341e",
          cover: "linear-gradient(135deg,#241f63 0 46%,#ef1f95 46% 74%,#241f63 74% 100%),linear-gradient(45deg,transparent 0 40%,rgba(255,255,255,.08) 40% 44%,transparent 44% 100%),#241f63",
          tag: "Side A"
        },
        {
          id: "skilling",
          menuTitle: "Skilling Sessions",
          menuLabel: "Hands-on learning",
          menuDescription: "Build skills in guided sessions with a coach built in to help you along the way.",
          detailTitle: "Skilling sessions",
          detailEyebrow: "Coach-supported learning",
          detailDescription: "Learn with a coach built in. Explore a guided session and see how the integrated coach can help you work through the material as you go.",
          detailWhatToTry: "Open a session, ask the coach a question, and see how it supports your learning.",
          ctaText: "Explore a skilling session",
          url: "https://aiskillsnavigator.microsoft.com/en-us/explore/search?type=skillingsession",
          cover: "linear-gradient(90deg,#111 0 40%,transparent 40% 100%),repeating-linear-gradient(135deg,#22b24b 0 18px,#0f1312 18px 36px),#22b24b",
          tag: "Side B"
        },
        {
          id: "mindset",
          menuTitle: "Human Skills for a Changing World",
          menuLabel: "Confidence + habits",
          menuDescription: "Watch Dr. Gervais introduce the mindsets that help you adapt in a changing world.",
          detailTitle: "Human Skills for a Changing World",
          detailEyebrow: "Mindsets for change",
          detailDescription: "Watch Dr. Gervais introduce the mindsets that help you adapt in a changing world.",
          detailWhatToTry: "Watch the preview of High-Performance Mindsets for a Changing World, then explore the course in AI Skills Navigator.",
          ctaText: "Watch the course preview",
          url: "https://aiskillsnavigator.microsoft.com/en-us/explore/search/video-b958f193e6f069f9e81d26605efb5c2074c349e3bb6b56c76ff25cb4add30840",
          cover: "radial-gradient(circle at 72% 52%,#1d7483 0 15%,transparent 15% 100%),repeating-radial-gradient(circle at 72% 52%,#2ab6b8 0 10px,#0d5e75 10px 20px),#1eaab0",
          tag: "Bonus Track"
        }
      ];

      const browse = document.getElementById("browse");
      const detail = document.getElementById("detail");
      const recordGrid = document.getElementById("recordGrid");
      const backBtn = document.getElementById("backBtn");
      const startOver = document.getElementById("startOver");

      const detailTitle = document.getElementById("detailTitle");
      const detailEyebrow = document.getElementById("detailEyebrow");
      const detailDescription = document.getElementById("detailDescription");
      const detailWhatToTry = document.getElementById("detailWhatToTry");
      const detailCta = document.getElementById("detailCta");
      const detailCover = document.getElementById("detailCover");
      const detailCoverTitle = document.getElementById("detailCoverTitle");
      const detailCoverTag = document.getElementById("detailCoverTag");

      let lastTrigger = null;

      function showBrowse() {
        detail.classList.add("hidden");
        browse.classList.remove("hidden");
        window.scrollTo(0, 0);
        if (lastTrigger) lastTrigger.focus();
      }

      function showDetail(exp, triggerEl) {
        lastTrigger = triggerEl || null;

        detailTitle.textContent = exp.detailTitle;
        detailEyebrow.textContent = exp.detailEyebrow;
        detailDescription.textContent = exp.detailDescription;
        detailWhatToTry.textContent = exp.detailWhatToTry;
        detailCta.textContent = exp.ctaText;
        detailCta.href = exp.url;

        detailCover.style.setProperty("--cover", exp.cover);
        detailCoverTitle.textContent = exp.menuTitle;
        detailCoverTag.textContent = exp.tag;

        browse.classList.add("hidden");
        detail.classList.remove("hidden");
        window.scrollTo(0, 0);
        backBtn.focus();
      }

      function buildCards() {
        experiences.forEach((exp) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "record";
          card.setAttribute("aria-label", "Open details for " + exp.menuTitle);

          card.innerHTML = `
            <div class="cover" style="--cover:${exp.cover}" aria-hidden="true">
              <span>Listening Lounge</span>
              <strong>${exp.menuTitle}</strong>
              <span>${exp.tag}</span>
            </div>
            <h3>${exp.menuTitle}</h3>
            <small>${exp.menuLabel}</small>
            <p>${exp.menuDescription}</p>
          `;

          card.addEventListener("click", () => showDetail(exp, card));
          recordGrid.appendChild(card);
        });
      }

      backBtn.addEventListener("click", showBrowse);
      startOver.addEventListener("click", showBrowse);

      buildCards();
    })();
  </script>
</body>
</html>
